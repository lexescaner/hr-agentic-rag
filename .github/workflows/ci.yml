name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build/import check — confirm app and agent modules load
        run: |
          python -c "import app; print('app.py imports OK')"
          python -c "import agent; print('agent.py imports OK')"

      - name: Build RAG index (needed for MCP tool discovery test)
        run: python rag/policy_rag.py --build

      - name: Run smoke tests (app startup + MCP tool discovery/call)
        run: pytest tests/test_smoke.py -v

  # Deployment is a separate job so it only runs if build-and-test succeeds,
  # satisfying the rubric's "deployment must only occur if tests pass."
  # Render auto-deploys on push to main via a deploy hook webhook — this job
  # explicitly triggers that hook only after tests pass, rather than relying
  # solely on Render's own push-triggered auto-deploy (which is not gated on
  # this repo's own CI at all). The hook URL is a secret (RENDER_DEPLOY_HOOK)
  # so it never appears in the repo or workflow logs.
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Deploy hook triggered — tests passed on main."

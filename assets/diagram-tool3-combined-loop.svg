<svg viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#444" />
    </marker>
  </defs>

  <text x="500" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#6c3d82">
    Combined Run: both tools called within a single agent.py ReAct loop
  </text>
  <text x="500" y="42" text-anchor="middle" font-size="10" fill="#888">
    (this is what actually ran during testing — Tool 1 and Tool 2 above each show one step of this loop)
  </text>

  <!-- User prompt -->
  <rect x="20" y="70" width="150" height="70" rx="8" fill="#fdf1f1" stroke="#c0392b" stroke-width="1.5"/>
  <text x="95" y="92" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">Original User Prompt</text>
  <text x="95" y="108" text-anchor="middle" font-size="8" fill="#555">"I'm employee EMP001.</text>
  <text x="95" y="120" text-anchor="middle" font-size="8" fill="#555">Can I take 3 days of</text>
  <text x="95" y="132" text-anchor="middle" font-size="8" fill="#555">PTO next week?"</text>

  <line x1="170" y1="105" x2="215" y2="105" stroke="#444" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Agent loop container -->
  <rect x="215" y="60" width="560" height="280" rx="8" fill="#faf5fc" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="495" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#6c3d82">agent.py — single ReAct loop (create_react_agent)</text>

  <!-- Step 1: call tool 1 -->
  <rect x="235" y="95" width="150" height="55" rx="6" fill="#eafaf1" stroke="#12876a" stroke-width="1.5"/>
  <text x="310" y="115" text-anchor="middle" font-size="9" font-weight="bold" fill="#12876a">Step 1: call</text>
  <text x="310" y="128" text-anchor="middle" font-size="9" font-weight="bold" fill="#12876a">check_pto_balance()</text>
  <text x="310" y="142" text-anchor="middle" font-size="7.5" fill="#555">→ 16 days remaining</text>

  <line x1="310" y1="150" x2="310" y2="180" stroke="#444" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Step 2: call tool 2 -->
  <rect x="235" y="185" width="150" height="55" rx="6" fill="#fdf6e3" stroke="#a8801f" stroke-width="1.5"/>
  <text x="310" y="205" text-anchor="middle" font-size="9" font-weight="bold" fill="#a8801f">Step 2: call</text>
  <text x="310" y="218" text-anchor="middle" font-size="9" font-weight="bold" fill="#a8801f">search_policy_documents()</text>
  <text x="310" y="232" text-anchor="middle" font-size="7.5" fill="#555">→ notice + approval rules</text>

  <line x1="385" y1="122" x2="440" y2="150" stroke="#444" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="385" y1="212" x2="440" y2="170" stroke="#444" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Merged augmented context -->
  <rect x="440" y="110" width="290" height="140" rx="6" fill="#fdf6e3" stroke="#a8801f" stroke-width="1.5"/>
  <text x="585" y="128" text-anchor="middle" font-size="10" font-weight="bold" fill="#a8801f">Step 3: Merged Augmented Context</text>
  <text x="450" y="145" font-size="8" fill="#555">Original question (unchanged)</text>
  <text x="450" y="160" font-size="8" font-family="monospace" fill="#333">+ pto_days_remaining: 16</text>
  <text x="450" y="172" font-size="8" font-family="monospace" fill="#333">+ pto_days_total: 25, used: 9</text>
  <text x="450" y="188" font-size="8" font-family="monospace" fill="#333">+ [PTO Policy, Requesting PTO]</text>
  <text x="450" y="199" font-size="7.5" fill="#555">  "...5 business days advance..."</text>
  <text x="450" y="213" font-size="8" font-family="monospace" fill="#333">+ [PTO Policy, Manager Approval]</text>
  <text x="450" y="224" font-size="7.5" fill="#555">  "...requires manager approval..."</text>
  <text x="450" y="240" font-size="7.5" font-style="italic" fill="#666">→ both tool outputs merged into ONE context</text>

  <line x1="585" y1="250" x2="585" y2="285" stroke="#444" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- LLM inside loop -->
  <rect x="500" y="285" width="170" height="45" rx="6" fill="#e8f0f9" stroke="#1a4d73" stroke-width="1.5"/>
  <text x="585" y="304" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4d73">Step 4: LLM synthesis</text>
  <text x="585" y="318" text-anchor="middle" font-size="7.5" fill="#555">Gemma via OpenRouter</text>

  <line x1="670" y1="307" x2="810" y2="200" stroke="#444" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Final answer -->
  <rect x="810" y="160" width="170" height="90" rx="8" fill="#eafaf1" stroke="#12876a" stroke-width="1.5"/>
  <text x="895" y="182" text-anchor="middle" font-size="10" font-weight="bold" fill="#12876a">Final Answer</text>
  <text x="895" y="198" text-anchor="middle" font-size="7.5" fill="#555">"You have 16 days</text>
  <text x="895" y="209" text-anchor="middle" font-size="7.5" fill="#555">remaining. Submit at</text>
  <text x="895" y="220" text-anchor="middle" font-size="7.5" fill="#555">least 5 business days</text>
  <text x="895" y="231" text-anchor="middle" font-size="7.5" fill="#555">in advance..."</text>
  <text x="895" y="244" text-anchor="middle" font-size="7" font-style="italic" fill="#888">(actual verified test output)</text>

  <text x="20" y="365" font-size="9" fill="#333" font-weight="bold">Why this differs from the two isolated diagrams above:</text>
  <text x="20" y="382" font-size="9" fill="#555">The isolated diagrams show each tool's augmentation mechanism in detail, in isolation, for clarity. In the actual running agent, both</text>
  <text x="20" y="396" font-size="9" fill="#555">tool calls happen inside the same ReAct loop before a single LLM call — the augmented context sent to the LLM is the union of both</text>
  <text x="20" y="410" font-size="9" fill="#555">tool outputs, not two separate LLM calls. This is what produced the real combined answer verified in testing.</text>
</svg>
